<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature Conversion Program</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header id="head">
        <h1 id="myh1">Temperature Conversion</h1>
      </header>

      <main id="mymain">
        <form action="abc.com" method="post">
          <div id="box">
            <label for="number"></label>
            <input
              type="number"
              id="number"
              required
              placeholder="enter number here"
            /><br />
          </div>

          <div id="c-f">
            <input type="radio" id="c to f" name="c & f" />
            <label for="c to f">Celcius to Fahrenheit</label>
            <br />
          </div>

          <div id="f-c">
            <input type="radio" id="f to c" name="c & f" />
            <label for="f to c">Fahrenheit to Celcius</label>
            <br />
          </div>
        </form>
      </main>

      <footer id="myfooter">
        <button id="btn">Reset</button>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
